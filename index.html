<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyAnything - Premium Marketplace</title>
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts Inter -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --bg: #0f172a; 
            --surface: #1e293b; 
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 4rem; overflow-x: hidden; }

        /* Smooth page load animation */
        body {
            animation: fadeInPage 0.6s ease-out forwards;
        }
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Premium Title Header Navbar Layout */
        nav {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.65rem; font-weight: 800; color: #ffffff; text-decoration: none; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        .nav-right { display: flex; gap: 1rem; align-items: center; }
        
        .nav-btn {
            background: #273549;
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn:hover { background: var(--primary); border-color: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 4px 12px var(--primary-glow); }
        .cart-count { background: var(--primary); color: white; padding: 0.1rem 0.5rem; border-radius: 50%; font-size: 0.8rem; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

        /* ================= INFINITE MOVING MARQUEE SHOWCASE ================= */
        .marquee-title { font-size: 1.25rem; font-weight: 700; color: var(--text-muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 1px;}
        .marquee-wrapper { 
            width: 100vw; 
            margin-left: calc(-50vw + 50%); 
            background: linear-gradient(90deg, #1e1b4b 0%, #0f172a 100%);
            padding: 1.5rem 0; 
            overflow: hidden; 
            position: relative;
            margin-bottom: 3rem;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .marquee-content { display: flex; width: max-content; animation: infiniteScroll 30s linear infinite; gap: 2rem; }
        .marquee-wrapper:hover .marquee-content { animation-play-state: paused; } 

        .marquee-card {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 260px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0.75rem;
            gap: 1rem;
            flex-shrink: 0;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .marquee-card:hover { border-color: var(--primary); transform: scale(1.02); }
        .marquee-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #334155; }
        .marquee-card-info { display: flex; flex-direction: column; justify-content: center; }
        .marquee-card-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .marquee-card-price { color: #60a5fa; font-weight: 700; font-size: 0.9rem; margin-top: 0.25rem; }

        @keyframes infiniteScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Layout Grid Blocks Split */
        .shop-layout { display: grid; grid-template-columns: 260px 1fr; gap: 2rem; }
        @media (max-width: 768px) { .shop-layout { grid-template-columns: 1fr; } }

        /* Left Side: Dedicated Category Selection Hub */
        .category-sidebar { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; height: fit-content; }
        .category-sidebar h3 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; }
        .category-list { display: flex; flex-direction: column; gap: 0.5rem; }
        
        .cat-link-btn { 
            background: none; 
            border: none; 
            text-align: left; 
            padding: 0.75rem 1rem; 
            border-radius: 8px; 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cat-link-btn:hover { background: #273549; color: white; padding-left: 1.25rem; }
        .cat-link-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }

        /* Right Side: Grid Showcase Area */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        
        .product-card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            overflow: hidden; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            flex-direction: column; 
            opacity: 0;
            animation: cardAppear 0.4s ease-out forwards;
        }
        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card:hover { 
            transform: translateY(-8px) scale(1.01); 
            box-shadow: 0 12px 24px -5px rgba(37, 99, 235, 0.2), 0 0 0 1px var(--primary); 
            border-color: var(--primary); 
        }
        .product-img { width: 100%; height: 180px; object-fit: cover; background: #334155; transition: transform 0.5s ease; }
        .product-card:hover .product-img { transform: scale(1.04); }
        
        .product-info { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-name { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
        .product-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
        .product-price { font-size: 1.15rem; font-weight: 700; color: #60a5fa; }
        
        .add-cart-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 0.6rem 1rem; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem; 
            transition: all 0.2s ease;
        }
        .add-cart-btn:hover { background: var(--primary-dark); transform: scale(1.05); }

        /* ================= POPUP MODAL SUPPORT TICKET SYSTEM ================= */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            justify-content: center; align-items: center; 
            z-index: 1000; 
        }
        .modal-content { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 2.5rem; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 500px; 
            position: relative; 
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal.open { display: flex; }
        .modal.open .modal-content { transform: scale(1); opacity: 1; }
        
        .close-modal { position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; transition: color 0.2s; }
        .close-modal:hover { color: white; }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.85rem; color: var(--text-muted); }
        input, textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); background: #111827; color: white; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary-glow); }
<style>
    /* Premium Animated Button Styles */
    .btn { 
        width: 100%; 
        padding: 0.85rem; 
        background: var(--primary); 
        color: white; 
        border: none; 
        border-radius: 8px; 
        font-weight: 600; 
        cursor: pointer; 
        transition: all 0.2s; 
        text-align: center; 
    }
    .btn:hover { 
        background: var(--primary-dark); 
        transform: translateY(-1px); 
        box-shadow: 0 4px 12px var(--primary-glow); 
    }
</style>

<!-- Header Navigation Elements -->
<nav>
    <a href="index.html" class="logo">Buy<span>Anything</span></a>
    <div class="nav-right">
        <button class="nav-btn" id="openTicketBtn"><i class="fa-solid fa-envelope-open-text"></i> Ticket</button>
        <a href="cart.html" class="nav-btn">
            <i class="fa-solid fa-shopping-cart"></i> Cart <span class="cart-count" id="cartCount">0</span>
        </a>
        <a href="admin.html" class="nav-btn"><i class="fa-solid fa-user-shield"></i> Admin Settings</a>
    </div>
</nav>

<!-- Left Categories Selection Layout -->
<div class="category-sidebar">
    <h3>Categories</h3>
    <div class="category-list" id="categoryHub"></div>
</div>

<!-- Modal Ticket View Overlay Window -->
<div class="modal" id="ticketModal">
    <div class="modal-content">
        <button class="close-modal" id="closeTicketBtn">&times;</button>
        <h3><i class="fa-solid fa-ticket"></i> Open Support Ticket</h3>
        <p>Fill out this form to submit your ticket query directly to administration via email.</p>
        
        <form id="supportTicketForm" action="https://formsubmit.co" method="POST">
            <div class="form-group">
                <label for="ticketUser">Your Name</label>
                <input type="text" name="Name" id="ticketUser" required placeholder="Alex Smith">
            </div>
            <div class="form-group">
                <label for="ticketEmail">Your Contact Return Email</label>
                <input type="email" name="Email" id="ticketEmail" required placeholder="alex@school.com">
            </div>
            <div class="form-group">
                <label for="ticketMsg">Inquiry Message</label>
                <textarea name="Message" id="ticketMsg" rows="4" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit" class="btn">Dispatch Ticket Email</button>
        </form>
    </div>
</div>
