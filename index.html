<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyAnything123 - Premium Shop</title>
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        /* Navbar */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-btn {
            background: #f1f5f9;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--border);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Category Filter Tabs */
        .categories-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .product-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: #e2e8f0;
        }

        .product-info {
            padding: 1.25rem;
        }

        .product-cat {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .product-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Admin Modal & Panel */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Forms styling */
        h2 { margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem;}
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--primary); }
        
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }

        /* Admin Layout Grid */
        .admin-section {
            display: none;
            margin-top: 2rem;
            border-top: 2px dashed var(--border);
            padding-top: 2rem;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 768px) {
            .admin-grid { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
        }

        /* AI Checkbox Container */
        .ai-toggle-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #eff6ff;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
        }
        .ai-toggle-box input { width: auto; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <a href="#" class="logo">buyanything123</a>
        <button class="nav-btn" id="adminControlBtn"><i class="fa-solid fa-lock"></i> Admin Settings</button>
    </nav>

    <div class="container">
        <!-- Shop Section -->
        <div id="shopView">
            <div class="categories-tabs" id="categoriesTabs">

            <div class="products-grid" id="productsGrid">

                <div class="panel-box">

                            <input type="text" id="newCategoryName" placeholder="Category Name (e.g., Electronics)" required>

                        <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Add Category</button>
                    </form>
                    <div id="adminCategoriesList" style="margin-top: 1.5rem;">
                        <!-- Category list with delete options -->
                    </div>
                </div>

                <!-- Product Management -->
                <div class="panel-box">
                    <h3>Manage Products</h3>
                    <form id="addProductForm" style="margin-top: 1rem;">

                            <label>Product Name</label>
                            <input type="text" id="prodName" required placeholder="iPhone 15, Running Shoes...">
                        </div>
                        <div class="form-group">
                            <label>Price ($)</label>
                            <input type="number" id="prodPrice" step="0.01" required placeholder="99.99">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="prodCategory" required>
